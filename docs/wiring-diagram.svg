<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 940 530" width="940" height="530" font-family="system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" xmlns:c2pa="http://c2pa.org/manifest">
  <defs>
    <marker id="ar" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0 0L10 5L0 10z" fill="#d62828"/>
    </marker>
  </defs>

  <rect x="1" y="1" width="938" height="528" rx="12" fill="#ffffff" stroke="#dde1e6"/>
  <text x="30" y="28" font-size="18" font-weight="700" fill="#1b1f24">Wiring Laser Tripwire (ESP32)</text>

  <!-- ESP32 -->
  <rect x="60" y="40" width="200" height="470" rx="10" fill="#1f2937"/>
  <text x="160" y="64" font-size="15" font-weight="700" fill="#ffffff" text-anchor="middle">ESP32 DevKit</text>
  <g font-size="13" fill="#ffffff" text-anchor="end">
    <text x="246" y="95">3V3</text>
    <text x="246" y="175">GPIO34</text>
    <text x="246" y="255">GPIO25</text>
    <text x="246" y="355">GPIO27</text>
    <text x="246" y="395">VIN (5V)</text>
    <text x="246" y="475">GND</text>
  </g>
  <g fill="#e5c07b" stroke="#1f2937" stroke-width="1">
    <circle cx="260" cy="90" r="5"/>
    <circle cx="260" cy="170" r="5"/>
    <circle cx="260" cy="250" r="5"/>
    <circle cx="260" cy="350" r="5"/>
    <circle cx="260" cy="390" r="5"/>
    <circle cx="260" cy="470" r="5"/>
  </g>

  <!-- Kabel -->
  <g fill="none" stroke-width="4" stroke-linecap="round" stroke-linejoin="round">
    <!-- 3V3 -> LDR -->
    <path d="M260 90 H620 V108" stroke="#7e22ce"/>
    <!-- LDR -> titik tengah, GPIO34 -->
    <path d="M620 152 V170" stroke="#2a9d3b"/>
    <path d="M260 170 H620" stroke="#2a9d3b"/>
    <path d="M620 170 V205" stroke="#2a9d3b"/>
    <!-- 10k -> GND -->
    <path d="M620 261 V470" stroke="#111111"/>
    <!-- GPIO25 -> 330 -> LED -->
    <path d="M260 250 H300" stroke="#f77f00"/>
    <path d="M360 250 H435" stroke="#f77f00"/>
    <!-- LED -> GND -->
    <path d="M478 250 H580 V470" stroke="#111111"/>
    <!-- Laser -->
    <path d="M260 350 H380" stroke="#1d4ed8"/>
    <path d="M260 390 H380" stroke="#d62828"/>
    <path d="M380 430 H340 V470" stroke="#111111"/>
    <!-- GND bus -->
    <path d="M260 470 H620" stroke="#111111"/>
  </g>

  <!-- Titik sambungan -->
  <g fill="#111111">
    <circle cx="620" cy="170" r="5" fill="#2a9d3b"/>
    <circle cx="340" cy="470" r="5"/>
    <circle cx="580" cy="470" r="5"/>
    <circle cx="620" cy="470" r="5"/>
  </g>

  <!-- LDR -->
  <circle cx="620" cy="130" r="26" fill="#f6f7f9" stroke="#1b1f24" stroke-width="2.5"/>
  <path d="M620 108 L620 114 L610 118 L630 126 L610 134 L630 142 L620 146 L620 152" fill="none" stroke="#1b1f24" stroke-width="2.5" stroke-linejoin="round"/>
  <text x="655" y="135" font-size="14" font-weight="700" fill="#1b1f24">LDR</text>
  <g stroke="#d62828" stroke-width="2.5" marker-end="url(#ar)">
    <line x1="548" y1="108" x2="590" y2="124"/>
    <line x1="548" y1="152" x2="590" y2="136"/>
  </g>
  <text x="540" y="134" font-size="11" fill="#d62828" text-anchor="end">sinar laser</text>

  <!-- Resistor 10k -->
  <rect x="608" y="205" width="24" height="56" rx="3" fill="#e3c99a" stroke="#1b1f24" stroke-width="2"/>
  <text x="642" y="238" font-size="13" fill="#1b1f24">10 kΩ</text>

  <!-- Resistor 330 -->
  <rect x="300" y="238" width="60" height="24" rx="3" fill="#e3c99a" stroke="#1b1f24" stroke-width="2"/>
  <text x="330" y="228" font-size="13" fill="#1b1f24" text-anchor="middle">330 Ω</text>

  <!-- LED -->
  <polygon points="435,235 435,265 475,250" fill="#fcd90a" stroke="#1b1f24" stroke-width="2"/>
  <line x1="478" y1="234" x2="478" y2="266" stroke="#1b1f24" stroke-width="3"/>
  <text x="456" y="224" font-size="13" font-weight="700" fill="#1b1f24" text-anchor="middle">LED</text>
  <text x="456" y="284" font-size="11" fill="#5f6b7a" text-anchor="middle">kaki panjang (+) di kiri</text>

  <!-- Laser KY-008 -->
  <text x="440" y="326" font-size="14" font-weight="700" fill="#1b1f24" text-anchor="middle">Laser KY-008</text>
  <rect x="380" y="335" width="120" height="110" rx="8" fill="#f6f7f9" stroke="#1b1f24" stroke-width="2.5"/>
  <g fill="#e5c07b" stroke="#1b1f24" stroke-width="1">
    <circle cx="380" cy="350" r="5"/>
    <circle cx="380" cy="390" r="5"/>
    <circle cx="380" cy="430" r="5"/>
  </g>
  <g font-size="14" font-weight="700" fill="#1b1f24">
    <text x="394" y="355">S</text>
    <text x="394" y="395">+</text>
    <text x="394" y="435">−</text>
  </g>
  <line x1="500" y1="390" x2="548" y2="390" stroke="#d62828" stroke-width="3" stroke-dasharray="6 4" marker-end="url(#ar)"/>
  <text x="506" y="378" font-size="11" fill="#d62828">sinar laser</text>

  <!-- Legenda -->
  <text x="730" y="65" font-size="14" font-weight="700" fill="#1b1f24">Kabel</text>
  <g font-size="12" fill="#1b1f24">
    <line x1="730" y1="90" x2="760" y2="90" stroke="#7e22ce" stroke-width="4" stroke-linecap="round"/>
    <text x="770" y="94">3V3 → LDR</text>
    <line x1="730" y1="120" x2="760" y2="120" stroke="#2a9d3b" stroke-width="4" stroke-linecap="round"/>
    <text x="770" y="124">GPIO34 → tengah LDR/10k</text>
    <line x1="730" y1="150" x2="760" y2="150" stroke="#f77f00" stroke-width="4" stroke-linecap="round"/>
    <text x="770" y="154">GPIO25 → 330Ω → LED</text>
    <line x1="730" y1="180" x2="760" y2="180" stroke="#1d4ed8" stroke-width="4" stroke-linecap="round"/>
    <text x="770" y="184">GPIO27 → laser S</text>
    <line x1="730" y1="210" x2="760" y2="210" stroke="#d62828" stroke-width="4" stroke-linecap="round"/>
    <text x="770" y="214">VIN → laser +</text>
    <line x1="730" y1="240" x2="760" y2="240" stroke="#111111" stroke-width="4" stroke-linecap="round"/>
    <text x="770" y="244">GND → semua (−)</text>
  </g>
<metadata><c2pa:manifest></c2pa:manifest></metadata></svg>
